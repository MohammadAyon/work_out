<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101214">
<title>V-Taper Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceeef;--card:#fff;--ink:#14181d;--mute:#59626c;--line:#d3d8dc;--c:#2b59d6;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101214;--card:#181b1f;--ink:#eef0f2;--mute:#9aa3ad;--line:#2a2f35;--on:#0d0f11;color-scheme:dark}}
body[data-t=d1]{--c:#2b59d6}body[data-t=d2]{--c:#d6362b}body[data-t=d3]{--c:#1b8f4e}body[data-t=d4]{--c:#e2a300;--on:#14181d}
body[data-t=log],body[data-t=guide]{--c:var(--ink);--on:var(--card)}
@media (prefers-color-scheme:dark){body[data-t=d1]{--c:#6a92ff}body[data-t=d2]{--c:#ff6f64}body[data-t=d3]{--c:#3ccb7f}body[data-t=d4]{--c:#ffc83d}}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 40px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{padding:20px 0 10px}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:34px;line-height:1.05}
header p{margin:4px 0 0;color:var(--mute)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
nav button[aria-current=true]{background:var(--c);border-color:var(--c);color:var(--on)}
nav .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:var(--d)}
nav button[aria-current=true] .dot{background:var(--on)}
.top{padding:18px 0 4px}
.top h2{font-size:30px;line-height:1.1}
.top p{margin:4px 0;color:var(--mute)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .25s}
.cnt{font-size:14px;color:var(--mute)}
.ex,.box{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:14px 14px 12px;margin:12px 0}
.ex h3{font-size:23px;line-height:1.15}
.tg{margin:2px 0 8px;color:var(--mute);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);border-radius:4px;padding:1px 9px;font-weight:600;font-size:14px}
.pl{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.p{width:48px;height:48px;border-radius:50%;border:4px solid var(--c);background:var(--card);color:var(--ink);font:700 19px "Barlow Condensed",sans-serif;cursor:pointer;padding:0}
.p[aria-pressed=true]{background:radial-gradient(circle,var(--card) 0 6px,var(--c) 6.5px);color:transparent}
.wt{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mute)}
.wt input,.f input{width:84px;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:600 17px Barlow,sans-serif;padding:0 8px}
details{margin-top:8px;font-size:15px}
summary{cursor:pointer;color:var(--mute);min-height:32px;display:flex;align-items:center}
details p{margin:4px 0 2px}
button.act{min-height:44px;padding:0 18px;border-radius:6px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
button.pri{background:var(--ink);color:var(--card)}
.f{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.f label{display:flex;flex-direction:column;font-size:14px;color:var(--mute);gap:3px}
.f input[type=date]{width:150px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:14px}
.d{color:var(--mute);font-size:13px}
.x{background:none;border:0;color:var(--mute);font-size:20px;min-width:40px;min-height:40px;cursor:pointer}
.box h3{font-size:22px;margin-bottom:4px}
.box details{border-top:1px solid var(--line);padding-top:6px}
.box details:first-of-type{border:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.top h2{font-size:32px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:14px}
.stats div{background:var(--card);padding:10px 12px}
.stats span{display:block;font:700 28px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.stats small{color:var(--mute);font-size:13px;line-height:1.2;display:block}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sw{min-height:40px;padding:0 14px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--mute);font:600 14px Barlow,sans-serif;cursor:pointer}
.sw[aria-pressed=true]{border-color:var(--c);color:var(--ink);box-shadow:inset 0 0 0 1px var(--c)}
.ex{border-radius:8px}
.ex.done{opacity:.6}
.ex.done h3::after{content:" ✓";color:var(--c)}
.wt{gap:6px}
.wt>span:first-child{margin-right:4px}
.st{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 22px Barlow,sans-serif;cursor:pointer;padding:0}
.wt input{width:84px;min-height:44px;text-align:center}
.end{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.tw{overflow-x:auto;margin-top:12px}
.box h3+.f,.box h3+p{margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:var(--card);padding:0 14px calc(10px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0;overflow:hidden}
.dock[hidden]{display:none}
.dbar{height:5px;background:rgba(127,127,127,.4);margin:0 -14px}
.dbar i{display:block;height:100%;width:0;background:var(--card)}
.drow{max-width:560px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding-top:8px}
.dl{font-size:13px;opacity:.85;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{font:700 44px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.dbt{display:flex;gap:6px}
.dbt button{min-height:44px;min-width:50px;padding:0 10px;border-radius:8px;border:1px solid rgba(127,127,127,.6);background:transparent;color:var(--card);font:600 14px Barlow,sans-serif;cursor:pointer}
.dock button:focus-visible{outline-color:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px;max-width:92%;text-align:center;transition:opacity .2s,transform .2s;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.dockon{padding-bottom:140px}
body.dockon .toast{bottom:calc(138px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body data-t="d1">
<div class="wrap">
<header><h1>V-taper plan</h1><p>Upper, lower, full body. Tap a plate after each set.</p></header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main"></main>
</div>
<div id="dock" class="dock" role="timer" hidden><div class="dbar"><i id="dfill"></i></div>
<div class="drow"><div><div class="dl" id="dlab">Rest</div><div class="dt" id="dtime">0:00</div></div>
<div class="dbt"><button data-a="m15" id="dm" aria-label="Subtract 15 seconds">−15</button><button data-a="p15" aria-label="Add 15 seconds">+15</button><button data-a="pause" id="dpause">Pause</button><button data-a="skip" id="dskip">Skip</button></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const K="vtaper-v1",H=168;
const D=[
{id:"d1",tab:"Day 1",name:"Upper",sub:"Back, shoulders and upper chest. About 65 min.",why:"Lats come first for back width, then the heavy upper-chest press while you are fresh. Side delts come before arms because form fades with fatigue.",ex:[
["Wide-grip lat pulldown","Lats",3,"8–10","1–2","2–3 min","Assisted pull-up"],
["Incline dumbbell press (15–30°)","Upper chest, front delts",3,"6–10","1–2","2–3 min","Incline Smith or barbell press"],
["Chest-supported row","Mid-back, lats",3,"8–12","1–2","2 min","Seated cable row"],
["Cable lateral raise","Side delts",4,"12–20","0–1","60–90 s","Dumbbell lateral raise"],
["Low-to-high cable fly","Upper chest",2,"12–15","0–1","60–90 s","Incline dumbbell fly"],
["Reverse pec deck or cable rear-delt fly","Rear delts",2,"15–20","0–1","60 s","Face pull"],
["Overhead cable triceps extension","Triceps, long head",3,"10–12","0–1","90 s","Dumbbell overhead extension"],
["Incline dumbbell curl","Biceps, long head",3,"10–12","0–1","90 s","Cable curl behind the body"]]},
{id:"d2",tab:"Day 2",name:"Lower",sub:"Quads, hamstrings, glutes, calves and abs. About 60 min.",why:"Heavy compounds first, quads before hamstrings. Curls, calves and abs finish the session so they do not tire you before the big lifts.",ex:[
["Hack squat","Quads, glutes",3,"6–10","1–2","3 min","Smith squat or goblet squat"],
["Romanian deadlift","Hamstrings, glutes",3,"8–10","2","2–3 min","Dumbbell RDL or back extension"],
["Bulgarian split squat","Quads, glutes",2,"8–10 per leg","1–2","2 min","Walking lunge"],
["Seated or lying leg curl","Hamstrings",3,"10–12","0–1","90 s","Nordic curl negatives"],
["Standing calf raise (2 s pause at the bottom)","Calves",3,"8–12","0–1","90 s","Single-leg calf raise on a step"],
["Hanging leg raise","Abs",3,"10–15","1","60–90 s","Reverse crunch"]]},
{id:"d3",tab:"Day 3",name:"Full body",sub:"A second hit for back, chest, shoulders and legs. About 70 min.",why:"Pull-ups and the press come first. To save about 10 minutes, superset hammer curl with pushdown, and calf raise with cable crunch.",ex:[
["Pull-up (add weight when easy)","Lats, upper back",3,"6–10","1–2","2–3 min","Neutral-grip pulldown"],
["Low-incline barbell or machine press","Upper chest, delts",3,"6–8","1–2","2–3 min","Incline Smith press"],
["One-arm cable or T-bar row","Back thickness",2,"10–12","1","2 min","Dumbbell row"],
["Dumbbell lateral raise","Side delts",3,"15–20","0–1","60–90 s","Machine lateral raise"],
["Leg press (feet mid-height)","Quads, glutes",3,"10–12","1–2","2–3 min","Hack squat"],
["Seated leg curl","Hamstrings",2,"10–12","0–1","90 s","Lying leg curl"],
["Hammer curl","Biceps, forearms",2,"10–12","0–1","90 s","Cross-body curl"],
["Rope pushdown","Triceps",2,"12–15","0–1","60–90 s","Bar pushdown"],
["Seated calf raise","Calves",3,"12–15","0–1","60–90 s","Leg-press calf raise"],
["Cable crunch","Abs",3,"10–15","1","60–90 s","Machine crunch"]]},
{id:"d4",tab:"Day 4",name:"V-taper extra",sub:"Optional. About 45 min.",why:"Add this only when you have time and feel recovered. Skip it if your strength is dropping or your legs are still tired.",ex:[
["Cable lateral raise","Side delts",4,"15–20","0–1","60 s","Dumbbell lateral raise"],
["Incline dumbbell press","Upper chest",3,"10–12","1","2 min","Incline machine press"],
["Neutral-grip lat pulldown","Lats",3,"10–12","1","2 min","Assisted pull-up"],
["Rear-delt cable fly","Rear delts",3,"15–20","0–1","60 s","Reverse pec deck"],
["Cable curl","Biceps",2,"12–15","0–1","60 s","Dumbbell curl"],
["Rope pushdown","Triceps",2,"12–15","0–1","60 s","Bar pushdown"],
["Ab wheel rollout","Abs",3,"8–12","1","60–90 s","Cable crunch"]]}];
const COL={d1:"#2b59d6",d2:"#d6362b",d3:"#1b8f4e",d4:"#e2a300"};
const G=[
["Progression","Stay at the same weight until every set reaches the top of the rep range at the target RIR. Then add 2.5–5% (1–2 kg for dumbbells, 5 kg for legs). Log every session with the weight box on each card."],
["Intensity (RIR)","RIR is how many good reps you could still do. Use 3 RIR for the first two weeks, then the RIR shown on each card. End a set when your form breaks."],
["Warm-up","Your walk to the gym is the general warm-up. Before the first compound lift, do 50% × 8, 70% × 4–5 and 85% × 2–3. Before later compounds, do one lighter set."],
["Cardio","Keep your daily steps steady. Do the 1 km run on non-leg days. On Day 2, keep it easy or skip it. If sleep or leg strength gets worse, cut the run before cutting lifting."],
["Deload","Every 5th or 6th week, halve the sets and keep 3–4 RIR. Do it sooner if your strength drops for two sessions in a row."],
["Food","Protein: about 140–170 g a day. Fat-loss pace: 0.4–0.7 kg a week. Losing more than 1 kg a week for two weeks, or lifts dropping: add 150–200 kcal. Losing less than 0.3 kg a week for three weeks: cut 100–150 kcal or add steps."],
["As you get leaner","Add weight to pull-ups and leg raises when they feel easy. A waist of about 0.45 × your height (76 cm) is a strong V-taper target. Near 0.47 (79 cm), consider a maintenance or small-surplus phase to build shoulders and back."]];
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S.c=S.c||{};S.w=S.w||{};S.l=S.l||[];S.h=S.h||[];S.o=Object.assign({auto:true,sound:true,wake:false},S.o);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const pop=n=>{let c=0;while(n){c+=n&1;n>>=1}return c};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const nav=document.getElementById("nav"),main=document.getElementById("main");
let tab=(location.hash||"").slice(1);
if(![...D.map(d=>d.id),"log","guide"].includes(tab))tab="d1";
function renderNav(){
 nav.innerHTML=D.map(d=>`<button data-t="${d.id}" ${tab==d.id?'aria-current="true"':''} style="--d:${COL[d.id]}"><span class="dot"></span>${d.tab}</button>`).join("")+
 `<button data-t="log" ${tab=="log"?'aria-current="true"':''}>Log</button><button data-t="guide" ${tab=="guide"?'aria-current="true"':''}>Guide</button>`;
}
function progress(d){
 const tot=d.ex.reduce((a,e)=>a+e[2],0);
 const done=d.ex.reduce((a,e,i)=>a+pop(S.c[d.id+"-"+i]||0),0);
 return[done,tot];
}
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
const restSec=t=>{const n=(t.match(/\d+/g)||[90]).map(Number);return Math.max(...n)*(/min/.test(t)?60:1)};
const today=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
let ac=null,wl=null,tt=null;
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=="suspended")ac.resume()}catch(e){}}
function beep(){if(!S.o.sound)return;try{unlock();[0,.28,.56].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i==2?1040:780;g.gain.value=.18;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.16)})}catch(e){}}
async function wake(){try{if(S.o.wake&&"wakeLock"in navigator&&document.visibilityState=="visible"){if(!wl)wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}else if(wl&&!S.o.wake){await wl.release();wl=null}}catch(e){wl=null}}
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3200)}
function startRest(sec,label){S.t={end:Date.now()+sec*1000,total:sec,label,paused:0,fin:0};save();tick()}
function tick(){
 const se=$("ses");if(se)se.textContent=S.ss?fmt((Date.now()-S.ss)/1000):"0:00";
 const t=S.t,dock=$("dock");
 if(!t){dock.hidden=true;document.body.classList.remove("dockon");return}
 const left=t.paused||Math.ceil((t.end-Date.now())/1000);
 if(left<=0&&!t.fin){t.fin=1;save();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast("Rest over. Start your next set.")}
 const over=!!t.fin||left<=0;
 dock.hidden=false;document.body.classList.add("dockon");
 dock.classList.toggle("over",over);
 $("dlab").textContent=over?"Rest over":(t.paused?"Paused":"Rest")+(t.label?": "+t.label:"");
 $("dtime").textContent=over?"Go":fmt(left);
 $("dfill").style.width=over?"100%":Math.max(0,Math.min(100,(1-left/t.total)*100))+"%";
 $("dpause").textContent=t.paused?"Resume":"Pause";
 $("dpause").hidden=over;$("dm").hidden=over;
 $("dskip").textContent=over?"Dismiss":"Skip";
}
function plate(p){
 const k=p.dataset.k,j=+p.dataset.j,d=D.find(x=>x.id==tab),e=d.ex[+k.split("-")[1]];
 S.c[k]=(S.c[k]||0)^(1<<j);
 const on=!!(S.c[k]>>j&1);
 p.setAttribute("aria-pressed",String(on));
 p.closest(".ex").classList.toggle("done",S.c[k]==(1<<e[2])-1);
 const[a,t]=progress(d);
 $("fill").style.width=a/t*100+"%";$("cnt").textContent=a+" of "+t;
 if(on){
  unlock();if(!S.ss)S.ss=Date.now();
  if(a==t){S.t=null;toast("All sets done. Tap Finish workout to save it.")}
  else if(S.o.auto)startRest(restSec(e[5]),e[0]);
 }
 save();tick();
}
function finish(d){
 const[a,t]=progress(d);
 if(!a){toast("Check off at least one set first.");return}
 S.h.unshift({id:Date.now(),d:today(),n:d.tab+": "+d.name,a,t,m:S.ss?Math.max(1,Math.round((Date.now()-S.ss)/6e4)):0});
 d.ex.forEach((_,i)=>delete S.c[d.id+"-"+i]);
 S.ss=null;S.t=null;save();render();toast("Workout saved to your log.");
}
function exp(){
 const b=new Blob([JSON.stringify({v:1,c:S.c,w:S.w,l:S.l,h:S.h,o:S.o})],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="vtaper-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1e3);toast("Backup downloaded.");
}
function renderDay(d){
 const[done,tot]=progress(d),wk=S.h.filter(h=>Date.now()-h.id<6048e5).length;
 const sw=(k,t)=>`<button class="sw" data-o="${k}" aria-pressed="${!!S.o[k]}">${t}</button>`;
 main.innerHTML=`<section class="top"><h2>${d.tab}: ${d.name}</h2><p>${d.sub}</p><p>${d.why}</p>
 <div class="stats"><div><span id="cnt">${done} of ${tot}</span><small>sets done</small></div>
 <div><span id="ses">${S.ss?fmt((Date.now()-S.ss)/1000):"0:00"}</span><small>session time</small></div>
 <div><span>${wk}</span><small>workouts in 7 days</small></div></div>
 <div class="bar"><i id="fill" style="width:${done/tot*100}%"></i></div>
 <div class="sws">${sw("auto","Auto rest timer")}${sw("sound","Sound")}${sw("wake","Keep screen on")}</div></section>`+
 d.ex.map((e,i)=>{const k=d.id+"-"+i,m=S.c[k]||0;
  return `<article class="ex${m==(1<<e[2])-1?" done":""}"><h3>${e[0]}</h3><p class="tg">${e[1]}</p>
  <div class="chips"><span>${e[2]} × ${e[3]}</span><span>RIR ${e[4]}</span><span>Rest ${e[5]}</span></div>
  <div class="pl">${Array.from({length:e[2]},(_,j)=>`<button class="p" data-k="${k}" data-j="${j}" aria-pressed="${!!(m>>j&1)}" aria-label="Set ${j+1} of ${e[2]}">${j+1}</button>`).join("")}</div>
  <div class="wt"><span>Weight</span><button class="st" data-s="-2.5" aria-label="Decrease weight by 2.5 kilograms">−</button>
  <input type="text" inputmode="decimal" data-w="${k}" value="${esc(S.w[k]||"")}" placeholder="0" aria-label="Weight in kilograms for ${esc(e[0])}">
  <button class="st" data-s="2.5" aria-label="Increase weight by 2.5 kilograms">+</button><span>kg</span></div>
  <details><summary>No machine? Swap for</summary><p>${e[6]}</p></details></article>`}).join("")+
 `<div class="end"><button class="act pri" id="fin">Finish workout</button><button class="act" id="clr">Clear checkmarks</button></div>`;
}
function renderLog(){
 const rows=S.l.slice().sort((a,b)=>String(b.d).localeCompare(String(a.d))||b.id-a.id),hs=S.h.slice(0,12);
 const ws=rows.filter(r=>r.w),dw=ws.length>1?ws[0].w-ws[ws.length-1].w:null;
 main.innerHTML=`<section class="top"><h2>Progress log</h2><p>Weigh in at the same time each morning. Measure your waist at the navel once a week.</p></section>
 <div class="box"><h3>Body</h3><div class="f"><label>Date<input type="date" id="ld" value="${today()}"></label>
 <label>Weight (kg)<input type="text" inputmode="decimal" id="lw"></label>
 <label>Waist (cm)<input type="text" inputmode="decimal" id="lc"></label>
 <button class="act pri" id="ls">Save entry</button></div>
 ${dw!==null?`<p class="d">Weight change since your first entry: ${dw>0?"−":"+"}${Math.abs(dw).toFixed(1)} kg.</p>`:""}
 ${rows.length?`<div class="tw"><table><tr><th>Date</th><th>Weight</th><th>Waist</th><th>Waist ÷ height</th><th></th></tr>`+
 rows.map(r=>`<tr><td>${esc(r.d)}</td><td>${r.w?(+r.w)+" kg":"–"}</td><td>${r.c?(+r.c)+" cm":"–"}</td><td>${r.c?(r.c/H).toFixed(3):"–"}</td><td><button class="x" data-del="${+r.id}" aria-label="Delete entry">×</button></td></tr>`).join("")+`</table></div>
 <p class="d">Height used: ${H} cm. Waist ÷ height of 0.5 is 84 cm. About 0.45 is 76 cm.</p>`:`<p>No entries yet. Add your first weight and waist above.</p>`}</div>
 <div class="box"><h3>Workout history</h3>${hs.length?`<div class="tw"><table><tr><th>Date</th><th>Workout</th><th>Sets</th><th>Min</th><th></th></tr>`+
 hs.map(h=>`<tr><td>${esc(h.d)}</td><td>${esc(h.n)}</td><td>${+h.a}/${+h.t}</td><td>${h.m?+h.m:"–"}</td><td><button class="x" data-dh="${+h.id}" aria-label="Delete workout">×</button></td></tr>`).join("")+`</table></div>`:`<p>No finished workouts yet. Tap Finish workout at the end of a session.</p>`}</div>
 <div class="box"><h3>Backup</h3><p class="d">Your data lives in this browser only. Download a backup before you clear browsing data or switch phones.</p>
 <div class="end"><button class="act" id="ex">Download backup</button><button class="act" id="imb">Restore backup</button></div>
 <input type="file" id="imp" accept="application/json,.json" hidden></div>`;
}
function renderGuide(){
 main.innerHTML=`<section class="top"><h2>Guide</h2><p>The rules behind the plan.</p></section><div class="box">`+
 G.map((g,i)=>`<details ${i==0?"open":""}><summary><b>${g[0]}</b></summary><p>${g[1]}</p></details>`).join("")+`</div>`;
}
function render(){
 document.body.dataset.t=tab;renderNav();
 const d=D.find(x=>x.id==tab);
 if(d)renderDay(d);else if(tab=="log")renderLog();else renderGuide();
 window.scrollTo(0,0);tick();
}
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;location.hash=tab;render()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h!=tab&&[...D.map(d=>d.id),"log","guide"].includes(h)){tab=h;render()}});
main.addEventListener("click",e=>{
 const t=e.target,p=t.closest(".p");
 if(p){plate(p);return}
 const st=t.closest(".st");
 if(st){const i=st.parentNode.querySelector("input"),v=Math.max(0,(parseFloat(String(i.value).replace(",","."))||0)+ +st.dataset.s);i.value=v?+v.toFixed(2):"";S.w[i.dataset.w]=i.value;save();return}
 const sw=t.closest(".sw");
 if(sw){const k=sw.dataset.o;S.o[k]=!S.o[k];sw.setAttribute("aria-pressed",String(S.o[k]));save();if(k=="wake")wake();if(k=="sound"&&S.o.sound){unlock();beep()}return}
 if(t.id=="fin"){finish(D.find(x=>x.id==tab));return}
 if(t.id=="clr"){D.find(x=>x.id==tab).ex.forEach((_,i)=>delete S.c[tab+"-"+i]);save();render();return}
 if(t.id=="ex"){exp();return}
 if(t.id=="imb"){$("imp").click();return}
 if(t.id=="ls"){
  const n=s=>parseFloat(String(s).replace(",","."))||0;
  const w=n($("lw").value),c=n($("lc").value),d=$("ld").value;
  if(!d||(!w&&!c)){toast("Add a weight or a waist measurement.");return}
  if((w&&(w<30||w>250))||(c&&(c<40||c>200))){toast("Check the numbers. Weight is in kg and waist is in cm.");return}
  S.l.push({id:Date.now(),d,w,c});save();renderLog();toast("Entry saved.");return}
 const x=t.closest("[data-del]");
 if(x){S.l=S.l.filter(r=>r.id!=x.dataset.del);save();renderLog();return}
 const h=t.closest("[data-dh]");
 if(h){S.h=S.h.filter(r=>r.id!=h.dataset.dh);save();renderLog()}
});
main.addEventListener("input",e=>{const k=e.target.dataset.w;if(k){S.w[k]=e.target.value;save()}});
main.addEventListener("change",e=>{
 if(e.target.id!="imp"||!e.target.files[0])return;
 e.target.files[0].text().then(s=>{
  const j=JSON.parse(s);if(!j||j.v!==1)throw 0;
  S.c=j.c&&typeof j.c=="object"?j.c:{};S.w=j.w&&typeof j.w=="object"?j.w:{};
  S.l=Array.isArray(j.l)?j.l:[];S.h=Array.isArray(j.h)?j.h:[];S.o=Object.assign({auto:true,sound:true,wake:false},j.o);
  save();render();toast("Backup restored.");
 }).catch(()=>toast("That file is not a valid backup."));
});
$("dock").addEventListener("click",e=>{
 const a=e.target.dataset.a,t=S.t;if(!a||!t)return;
 const over=!!t.fin||(!t.paused&&t.end<=Date.now());
 if(a=="skip")S.t=null;
 else if(a=="pause"&&!over){if(t.paused){t.end=Date.now()+t.paused*1000;t.paused=0}else t.paused=Math.max(1,Math.ceil((t.end-Date.now())/1000))}
 else if(a=="p15"){if(over){t.fin=0;t.paused=0;t.end=Date.now()+15000;t.total=15}else if(t.paused){t.paused+=15;t.total+=15}else{t.end+=15000;t.total+=15}}
 else if(a=="m15"&&!over){if(t.paused)t.paused=Math.max(1,t.paused-15);else t.end-=15000}
 save();tick();
});
document.addEventListener("visibilitychange",()=>{tick();wake()});
if(S.t&&!S.t.paused&&Date.now()-S.t.end>6e5)S.t=null;
if(S.ss&&Date.now()-S.ss>216e5)S.ss=null;
render();setInterval(tick,500);wake();
</script>
</body>
</html>
